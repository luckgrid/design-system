name: Defect or regression
description: The CSS behaves differently from its documented contract, or a release changed behavior.
labels: ["feedback: defect"]
body:
  - type: markdown
    attributes:
      value: |
        Feedback is evidence to triage. Reporting a need does not by itself add,
        promote, or guarantee any public API. Name the exact release version and
        archive checksum you pinned.
  - type: input
    id: version
    attributes:
      label: Release version
      description: The pinned version, for example 0.1.0-preview.1.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
      description: Include the browser, version, and platform, and a minimal page if you can.
    validations:
      required: true
