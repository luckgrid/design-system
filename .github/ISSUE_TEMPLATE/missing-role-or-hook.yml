name: Missing semantic role or hook
description: You need a semantic role, hook, or state the public surface does not offer.
labels: ["feedback: missing-role-or-hook"]
body:
  - type: markdown
    attributes:
      value: |
        Feedback is evidence to triage. Reporting a need does not by itself add,
        promote, or guarantee any public API. Name the exact release version and
        archive checksum you pinned.
  - type: input
    id: version
    attributes:
      label: Release version
      description: The pinned version, for example 0.1.0-preview.1.
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What you need and what you did instead
      description: Describe the design need first. Say which existing roles or hooks you tried.
    validations:
      required: true
