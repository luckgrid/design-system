name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Format
        run: cargo +1.98.1 fmt --all --check

      - name: Clippy
        run: cargo +1.98.1 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo +1.98.1 test --workspace --all-features --locked

      - name: MSRV check
        run: cargo +1.98.1 check --workspace --all-targets --locked

      - name: Bootstrap boundary
        run: cargo +1.98.1 run --locked -p design-system-check -- check bootstrap-surfaces.tsv fixtures/plain-html

      - name: CSS layer contract
        run: cargo +1.98.1 run --locked -p design-system-check -- layers exports.tsv bootstrap-surfaces.tsv fixtures/plain-html

      - name: Token authority
        run: cargo +1.98.1 run --locked -p design-system-check -- tokens tokens.tsv exports.tsv docs/architecture/tokens.md fixtures/plain-html fixtures/brand-theme fixtures/layouts fixtures/primitives fixtures/scoping fixtures/static-renderer/consumer tests/browser/probes

      - name: Theme contract
        run: cargo +1.98.1 run --locked -p design-system-check -- theme theme.tsv exports.tsv docs/architecture/theme.md fixtures tests/browser/probes

      - name: Classless base
        run: cargo +1.98.1 run --locked -p design-system-check -- base base.tsv exports.tsv docs/architecture/base.md fixtures/plain-html

      - name: Layout primitives
        run: cargo +1.98.1 run --locked -p design-system-check -- layout layouts.tsv exports.tsv docs/architecture/layouts.md fixtures/layouts

      - name: Primitives
        run: cargo +1.98.1 run --locked -p design-system-check -- primitive primitives.tsv layouts.tsv exports.tsv docs/architecture/primitives.md fixtures/primitives

      - name: Hooks and scoping
        run: cargo +1.98.1 run --locked -p design-system-check -- hooks layouts.tsv primitives.tsv theme.tsv exports.tsv docs/architecture/hooks.md fixtures/scoping

      - name: Install locked Tailwind adapter tooling
        working-directory: adapters/tailwind
        run: npm ci --no-audit --no-fund

      - name: Build and verify Tailwind adapter
        run: |
          npm --prefix adapters/tailwind run build
          cargo +1.98.1 run --locked -p design-system-check -- tailwind adapters/tailwind/projection.tsv tokens.tsv adapter-exports.tsv bootstrap-surfaces.tsv adapters/tailwind adapters/tailwind/fixture/output.css

      - name: Install pinned Hugo
        working-directory: ${{ github.workspace }}
        env:
          HUGO_SHA256: 45228f5a52eb118b0ca168068f01d7df0447314a24056f1d29667ed9fc368308
        run: |
          version=$(cat fixtures/static-renderer/HUGO_VERSION)
          archive="hugo_${version}_linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gohugoio/hugo/releases/download/v${version}/${archive}"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Stage and render the static renderer fixture
        run: |
          sh fixtures/static-renderer/stage.sh
          sh fixtures/static-renderer/build.sh

      - name: Prove staging and rendering need no Rust, Node, or Tailwind
        run: sh fixtures/static-renderer/verify-toolchain-free.sh

      - name: Static renderer fixture
        run: cargo +1.98.1 run --locked -p design-system-check -- static-renderer exports.tsv layouts.tsv primitives.tsv theme.tsv base.tsv fixtures/static-renderer

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build Tailwind adapter fixture
        run: |
          npm --prefix "$GITHUB_WORKSPACE/adapters/tailwind" ci --no-audit --no-fund
          npm --prefix "$GITHUB_WORKSPACE/adapters/tailwind" run build

      - name: Install pinned Hugo
        working-directory: ${{ github.workspace }}
        env:
          HUGO_SHA256: 45228f5a52eb118b0ca168068f01d7df0447314a24056f1d29667ed9fc368308
        run: |
          version=$(cat fixtures/static-renderer/HUGO_VERSION)
          archive="hugo_${version}_linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gohugoio/hugo/releases/download/v${version}/${archive}"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Stage and render the static renderer fixture
        working-directory: ${{ github.workspace }}
        run: |
          sh fixtures/static-renderer/stage.sh
          sh fixtures/static-renderer/build.sh

      - name: Browser contract (Chromium, Firefox, WebKit)
        run: npx playwright test
