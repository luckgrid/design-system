# Workspace descriptor — Design System source repository.
# One read here says what this workspace is, what authority governs it, and what
# has deliberately not been decided yet.

id = "design-system"
kind = "workspace-source"
title = "Design System"
status = "bootstrap"
summary = "Portable web-platform-first design system; repository bootstrapped, implementation not started."

system_space = "luckgrid"
domain = "design-system"
layer = "application"
system = "design-system"

[source]
repository = "luckgrid/design-system"
remote = "git@github.com:luckgrid/design-system.git"
visibility = "public"
default_branch = "main"

[paths]
root = "Build/src/workspaces/design-system"
planning_root = "Build/bin/design-system"
state = "Build/bin/design-system/_process/STATE.md"

# planning_root and state are paths within luckgrid/lg-workstreams (private),
# not within this repository.

[branch]
durable = "lg/design-system-e01"

# Deliberately absent until the source-decisions/bootstrap task:
#   [native]      manifests / toolchain pins
#   [entrypoints] setup, doctor, build, check commands
#   version, license, rust-version, Cargo members, package names
#   [capabilities].provides — this repository publishes nothing yet

[capabilities]
requires = ["filesystem.read"]

[policy]
# Normal repository changes use feature branches and pull requests; main is not
# developed on directly. Mirrors the Workstreams E01 branch/PR workflow rule.
allow_git_push = true
allow_direct_main_push = false
allow_secret_read = false
