# Workspace descriptor — Design System source repository.
# One read here says what this workspace is, what authority governs it, and what
# has deliberately not been decided yet.

id = "design-system"
kind = "workspace-source"
title = "Design System"
status = "experimental"
summary = "Portable web-platform-first design system; experimental, with a public-preview core CSS entrypoint."

system_space = "luckgrid"
domain = "design-system"
layer = "application"
system = "design-system"

[source]
repository = "luckgrid/design-system"
remote = "git@github.com:luckgrid/design-system.git"
visibility = "public"
default_branch = "main"

[paths]
root = "Build/src/workspaces/design-system"
planning_root = "Build/bin/design-system"
state = "Build/bin/design-system/_process/STATE.md"

# root, planning_root, and state are Workstreams-side paths within the private
# luckgrid/lg-workstreams repository; they are provenance metadata, not source
# paths or build dependencies of this public repository.

[branch]
durable = "main"
feature_prefix = "ds/"

[native]
workspace = "Cargo.toml"
toolchain = "rust-toolchain.toml"
rust_version = "1.98.1"
members = ["apps/ds-check"]

[entrypoints]
check = "cargo run --locked -p design-system-check -- check bootstrap-surfaces.tsv fixtures/plain-html"
layers = "cargo run --locked -p design-system-check -- layers exports.tsv bootstrap-surfaces.tsv fixtures/plain-html"
tokens = "cargo run --locked -p design-system-check -- tokens tokens.tsv exports.tsv docs/architecture/tokens.md fixtures/plain-html tests/browser/probes"
browser = "npx playwright test (run in tests/browser)"
core_css = "packages/styles/index.css"
token_inventory = "tokens.tsv"

# The repository remains intentionally unlicensed during pre-release
# development. Public visibility is not a license grant. A license must be
# selected and added before the first supported release candidate.

[capabilities]
provides = ["bootstrap-boundary-check", "css-layer-contract-check", "token-authority-check", "core-css-entrypoint", "semantic-tokens"]
requires = ["filesystem.read"]

[policy]
# Normal repository changes use feature branches and pull requests; main is not
# developed on directly. Mirrors the Workstreams DS-E01 branch/PR workflow rule.
allow_git_push = true
allow_direct_main_push = false
allow_secret_read = false
