<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Design System brand theme fixture</title>
    <link rel="stylesheet" href="/packages/styles/index.css">
    <link rel="stylesheet" href="./brand.css">
  </head>
  <body>
    <main>
      <h1>Tidewater</h1>
      <section class="panel">
        <p class="note">A consumer-owned brand mapped through public semantic roles.</p>
        <button type="button" class="cta">Brand action</button>
      </section>
      <form>
        <label>Name <input type="text" name="name"></label>
        <label>Plan
          <select name="plan">
            <option>Standard</option>
            <option>Extended</option>
          </select>
        </label>
        <label><input type="checkbox" name="updates"> Updates</label>
        <button type="button">Native button</button>
      </form>
    </main>
  </body>
</html>
